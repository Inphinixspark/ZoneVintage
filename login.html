<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Vintage</title>
    <style type="text/css">
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4e8c1;
            color: #3b2d2d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .vintage-form-container {
            background-color: #fff1e1;
            border: 3px solid #4a3728;
            padding: 25px;
            box-shadow: 0px 8px 16px rgba(74, 55, 40, 0.2);
            border-radius: 12px;
            width: 340px;
            text-align: center;
        }

        .form-title {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4a3728;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        }

        .input-container {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 16px 14px 10px;
            border: 2px solid #4a3728;
            border-radius: 6px;
            background-color: #fdf6e8;
            font-family: 'Courier New', Courier, monospace;
            color: #3b2d2d;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:hover {
            transform: scale(1.01);
            border-color: #7b5e3f;
        }

        input:focus {
            outline: none;
            border-color: #7b5e3f;
            background-color: #fff;
        }

        input::placeholder {
            color: #8a7a6a;
            font-size: 12px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        input:focus::placeholder,
        input:not(:placeholder-shown)::placeholder {
            opacity: 1;
        }

        .input-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #6b5846;
            pointer-events: none;
            transition: all 0.3s ease;
            background: transparent;
        }

        input:focus + .input-label,
        input:not(:placeholder-shown) + .input-label {
            top: -12px;
            left: 12px;
            font-size: 10px;
            color: #4a3728;
            background: #fff1e1;
            padding: 0 5px;
            font-weight: bold;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle-password svg {
            width: 24px;
            height: 24px;
            fill: #4a3728;
            stroke: #4a3728;
            stroke-width: 1;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .toggle-password:hover svg {
            fill: #7b5e3f;
            stroke: #7b5e3f;
        }

        button {
            background-color: #4a3728;
            color: #fff1e1;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            font-size: 14px;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #5f4633;
            transform: scale(1.02);
        }

        button a{
            color: #fff1e1;
            text-decoration: none;
            font-weight: bold;
        }

        p {
            font-size: 11px;
            margin: 8px 0;
            color: #6b5846;
        }

        a {
            color: #2e6b6b;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #3f8b8b;
        }

        #form-error {
            color: #9b3f3f;
            font-size: 11px;
            margin-top: 8px;
            font-style: italic;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="vintage-form-container">
        <h2 class="form-title">Connexion</h2>
        <p>Don't have an account? <a href="#">Sign-up</a>.</p>
        <form id="loginForm">
            <div class="input-container">
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre email" autocomplete="email" required>
                <span class="input-label">Email</span>
            </div>
            <div class="input-container">
                <label for="password" class="sr-only">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" autocomplete="current-password" required>
                <span class="input-label">Mot de passe</span>
                <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                    <svg class="password-icon" viewBox="0 0 24 24" aria-label="Afficher mot de passe">
                        <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                        <path d="M11 11.5c0-.55.45-1 1-1s1 .45 1 1c0 .28-.11.5-.28.67l-.67-.67z"/>
                    </svg>
                </span>
            </div>
            <div id="form-error"></div>
            <p>By logging in, you agree to our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</p>
            <a href="accueil.html" id="submit"></a><button type="submit">Se connecter</button></a>
        </form>
    </div>

    <script>
        // Form submission handling
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('form-error');

            // Reset error message
            errorDiv.textContent = '';

            // Basic validations
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = 'Veuillez entrer une adresse email valide.';
                return;
            }

            if (password.length === 0) {
                errorDiv.textContent = 'Le mot de passe est requis.';
                return;
            }

            // If validations pass, redirect (replace with actual login logic)
            window.location.href = 'dashboard.html';
        });

        // Password visibility toggle
        function togglePasswordVisibility(fieldId, spanElement) {
            const input = document.getElementById(fieldId);
            const svg = spanElement.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = `
                    <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    <path d="M3 3l18 18"/>
                `;
                svg.setAttribute('aria-label', 'Cacher mot de passe');
            } else {
                input.type = 'password';
                svg.innerHTML = `
                    <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    <path d="M11 11.5c0-.55.45-1 1-1s1 .45 1 1c0 .28-.11.5-.28.67l-.67-.67z"/>
                `;
                svg.setAttribute('aria-label', 'Afficher mot de passe');
            }
        }
    </script>
</body>
</html>
