<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Vintage</title>
    <style type="text/css">
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4e8c1;
            color: #3b2d2d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .vintage-form-container {
            background-color: #fff1e1;
            border: 3px solid #4a3728;
            padding: 25px;
            box-shadow: 0px 8px 16px rgba(74, 55, 40, 0.2);
            border-radius: 12px;
            width: 340px;
            text-align: center;
        }

        .form-title {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4a3728;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        }

        .input-container {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 16px 14px 10px;
            border: 2px solid #4a3728;
            border-radius: 6px;
            background-color: #fdf6e8;
            font-family: 'Courier New', Courier, monospace;
            color: #3b2d2d;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:hover {
            transform: scale(1.01);
            border-color: #7b5e3f;
        }

        input:focus {
            outline: none;
            border-color: #7b5e3f;
            background-color: #fff;
        }

        input::placeholder {
            color: #8a7a6a;
            font-size: 12px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        input:focus::placeholder,
        input:not(:placeholder-shown)::placeholder {
            opacity: 1;
        }

        .input-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #6b5846;
            pointer-events: none;
            transition: all 0.3s ease;
            background: transparent;
        }

        input:focus + .input-label,
        input:not(:placeholder-shown) + .input-label {
            top: -12px;
            left: 12px;
            font-size: 10px;
            color: #4a3728;
            background: #fff1e1;
            padding: 0 5px;
            font-weight: bold;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle-password svg {
            width: 24px;
            height: 24px;
            fill: #4a3728;
            stroke: #4a3728;
            stroke-width: 1;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .toggle-password:hover svg {
            fill: #7b5e3f;
            stroke: #7b5e3f;
        }

        button {
            background-color: #4a3728;
            color: #fff1e1;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            font-size: 14px;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #5f4633;
            transform: scale(1.02);
        }

        p {
            font-size: 11px;
            margin: 8px 0;
            color: #6b5846;
        }

        a {
            color: #2e6b6b;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #3f8b8b;
        }

        .password-strength {
            width: 100%;
            height: 8px;
            background-color: #e8d9c2;
            border: 1px solid #4a3728;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .strength-progress {
            height: 100%;
            background: linear-gradient(to right, #7b5e3f, #a68a64);
            width: 0%;
            transition: width 0.3s ease;
        }

        .confirm-status {
            font-size: 11px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b3f3f; /* Default: unmatched (vintage red) */
            font-style: italic;
        }

        .confirm-status.matched {
            color: #2e6b6b; /* Matched: vintage teal */
        }

        .confirm-status svg {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            fill: currentColor;
        }

        #form-error {
            color: #9b3f3f;
            font-size: 11px;
            margin-top: 8px;
            font-style: italic;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="vintage-form-container">
        <h2 class="form-title">Inscription</h2>
        <p>Already have an account? <a href="sign_in.html">Sign-in</a>.</p>
        <form id="signupForm">
            <div class="input-container">
                <label for="username" class="sr-only">Pseudonyme</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre pseudonyme" autocomplete="username" maxlength="15" required>
                <span class="input-label">Pseudonyme</span>
            </div>
            <div class="input-container">
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre email" autocomplete="email" required>
                <span class="input-label">Email</span>
            </div>
            <div class="input-container">
                <label for="password" class="sr-only">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" onkeyup="validatePassword()" required>
                <span class="input-label">Mot de passe</span>
                <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                    <svg class="password-icon" viewBox="0 0 24 24" aria-label="Afficher mot de passe">
                        <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                        <path d="M11 11.5c0-.55.45-1 1-1s1 .45 1 1c0 .28-.11.5-.28.67l-.67-.67z"/>
                    </svg>
                </span>
            </div>
            <div class="password-strength">
                <div class="strength-progress" id="strength-progress"></div>
            </div>
            <div class="input-container">
                <label for="confirm-password" class="sr-only">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmez votre mot de passe" onkeyup="checkPasswordMatch()" required>
                <span class="input-label">Confirmer le mot de passe</span>
                <span class="toggle-password" onclick="togglePasswordVisibility('confirm-password', this)">
                    <svg class="password-icon" viewBox="0 0 24 24" aria-label="Afficher mot de passe">
                        <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                        <path d="M11 11.5c0-.55.45-1 1-1s1 .45 1 1c0 .28-.11.5-.28.67l-.67-.67z"/>
                    </svg>
                </span>
            </div>
            <div class="confirm-status" id="confirm-status">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                </svg>
                Mots de passe non correspondants
            </div>
            <div id="form-error"></div>
            <p>By signing up, you agree to our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</p>
            <button type="submit">S'inscrire</button>
        </form>
    </div>

    <script>
        // Form submission handling
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('form-error');

            // Reset error message
            errorDiv.textContent = '';

            // Basic validations
            if (username.length < 3) {
                errorDiv.textContent = 'Le pseudonyme doit contenir au moins 3 caractères.';
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = 'Veuillez entrer une adresse email valide.';
                return;
            }

            // Check password strength
            const strengthProgress = document.getElementById('strength-progress');
            const width = parseFloat(strengthProgress.style.width);
            if (width < 100) {
                errorDiv.textContent = 'Le mot de passe ne répond pas à toutes les exigences.';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Les mots de passe ne correspondent pas.';
                return;
            }

            // If all validations pass, redirect
            window.location.href = 'zv.html';
        });

        // Password visibility toggle
        function togglePasswordVisibility(fieldId, spanElement) {
            const input = document.getElementById(fieldId);
            const svg = spanElement.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = `
                    <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    <path d="M3 3l18 18"/>
                `;
                svg.setAttribute('aria-label', 'Cacher mot de passe');
            } else {
                input.type = 'password';
                svg.innerHTML = `
                    <path d="M12 5c-7 0-10 4.5-10 7s3 7 10 7 10-4.5 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    <path d="M11 11.5c0-.55.45-1 1-1s1 .45 1 1c0 .28-.11.5-.28.67l-.67-.67z"/>
                `;
                svg.setAttribute('aria-label', 'Afficher mot de passe');
            }
            checkPasswordMatch(); // Update confirmation status if toggled
        }

        // Password strength validation
        function validatePassword() {
            const password = document.getElementById('password').value;
            const strengthProgress = document.getElementById('strength-progress');
            let conditionsMet = 0;

            // Uppercase check
            if (/[A-Z]/.test(password)) {
                conditionsMet++;
            }

            // Special character check
            if (/[\W_]/.test(password)) {
                conditionsMet++;
            }

            // Minimum length check
            if (password.length >= 8) {
                conditionsMet++;
            }

            // Number check
            if (/\d/.test(password)) {
                conditionsMet++;
            }

            // Update progress bar
            strengthProgress.style.width = `${conditionsMet * 25}%`;
            checkPasswordMatch(); // Update confirmation status
        }

        // Password match verification
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const confirmStatus = document.getElementById('confirm-status');

            if (confirmPassword.length === 0) {
                confirmStatus.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    </svg>
                    Entrez la confirmation
                `;
                confirmStatus.classList.remove('matched');
            } else if (password === confirmPassword) {
                confirmStatus.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    Mots de passe correspondants
                `;
                confirmStatus.classList.add('matched');
            } else {
                confirmStatus.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm4.59-12.42L13.17 11l3.42 3.42-1.41 1.41L12 12.83l-3.17 3.17-1.41-1.41L10.83 11 7.41 7.59 8.83 6.17 12 9.34l3.17-3.17 1.42 1.41z"/>
                    </svg>
                    Mots de passe non correspondants
                `;
                confirmStatus.classList.remove('matched');
            }
        }
    </script>
</body>
</html>
